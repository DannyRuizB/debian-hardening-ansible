---
# The yescrypt cost factor pinned in login.defs — 11 is the maximum the
# format accepts (range 1-11; stock Debian mints at 5). Each +1 doubles the
# work: at 11 a guess against a stolen shadow file costs ~1 s of CPU instead
# of milliseconds. Only NEW hashes pay it — existing hashes keep the cost
# they were minted with until the next password change. The same value goes
# on pam_unix's own line (rounds=), which Debian 12's PAM needs.
guess_cost_yescrypt_factor: 11

# Seconds a failed live authentication waits before control returns. It is
# on pam_faildelay's own line (delay=, in microseconds) and in login.defs'
# FAIL_DELAY wherever shadow knows that key (Debian 13; Debian 12's shadow
# rejects it).
guess_cost_fail_delay: 5

guess_cost_pam_password: /etc/pam.d/common-password
