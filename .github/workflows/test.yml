name: e2e

# The real proof: boot a disposable Debian "server" (systemd container),
# harden it with site.yml over real SSH, run the playbook again to prove
# idempotence, and then verify every promise from the outside.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  harden-and-verify:
    name: Harden a disposable Debian node + verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The full 'ansible' package brings community.general (ufw, sudoers)
      # and ansible.posix (authorized_key), which the roles depend on.
      - name: Install Ansible
        run: pip install ansible

      - name: Boot the test node
        run: ./tests/node.sh up && ./tests/node.sh wait

      # CIS 6.1 offenders planted BEFORE any pass (including --check, whose
      # read-only find probes see them): a world-writable file, an orphan
      # owned by a UID that doesn't exist, and a 777 dir without the sticky
      # bit. The file_permissions role must fix all three — verify's sweep
      # checks flip from red to green because of these, not by vacuum.
      - name: Plant file-permission offenders for the play to fix
        run: |
          docker exec dh-test-node bash -c "
            install -d -m 777 /usr/local/share/dh-ww-dir &&
            touch /usr/local/share/dh-ww-file && chmod 666 /usr/local/share/dh-ww-file &&
            touch /usr/local/share/dh-orphan && chown 12345:12345 /usr/local/share/dh-orphan"

      # CIS 5.4.2 / 6.2.9 offender: a service account with a REAL shell and a
      # usable password — exactly what a packaged daemon leaves behind, and a
      # valid su / SSH target. The system_accounts role must take both away,
      # so verify's checks flip from red to green because of this account.
      - name: Plant a system account with a login shell for system_accounts to lock
        run: |
          docker exec dh-test-node bash -c "
            useradd --system --shell /bin/bash --create-home dhsvc &&
            echo 'dhsvc:Plant3d!Svc#2026' | chpasswd"

      # CIS 4.2.3 offenders: a world-readable log file, and rsyslog.conf's own
      # FileCreateMode drifted to 0644 (one careless edit away on any box).
      # The log_permissions role must sweep the file to 0640 AND re-impose
      # 0640 on newly created logs via its drop-in — verify deletes syslog and
      # proves the reborn file's mode, so this flips red to green for real.
      - name: Plant log-permission offenders for log_permissions to fix
        run: |
          docker exec dh-test-node bash -c "
            touch /var/log/dh-app.log && chmod 666 /var/log/dh-app.log &&
            sed -i 's/^\\\$FileCreateMode 0640/\\\$FileCreateMode 0644/' /etc/rsyslog.conf"

      # CIS 4.4 offender: a logrotate snippet that re-creates its log 0666.
      # Stock Debian already offends on its own (bare global create, dpkg and
      # alternatives at 644) — this one is the evergreen guarantee should the
      # distro ever clean up: the logrotate_perms role must tighten it to
      # 0640 while keeping the owner/group arguments untouched.
      - name: Plant a logrotate offender for logrotate_perms to tighten
        run: |
          docker exec dh-test-node bash -c "
            touch /var/log/dh-rotated.log &&
            printf '/var/log/dh-rotated.log {\n  weekly\n  rotate 2\n  create 0666 root adm\n}\n' > /etc/logrotate.d/dh-rotated"

      # CIS 6.2 offender: an interactive user whose home is 755 — the default
      # many distros still ship — carrying the two legacy dotfiles that grant
      # access with no password (.netrc holds cleartext logins, .forward
      # reroutes mail). The home_permissions role must tighten the mode AND
      # remove both relics — verify's checks flip from red to green for real.
      - name: Plant a loose interactive home for home_permissions to tighten
        run: |
          docker exec dh-test-node bash -c "
            useradd --create-home --shell /bin/bash dhhome &&
            chmod 755 /home/dhhome &&
            printf 'machine example.com login dh password hunter2\n' > /home/dhhome/.netrc &&
            printf 'dh@elsewhere.example\n' > /home/dhhome/.forward &&
            chown dhhome:dhhome /home/dhhome/.netrc /home/dhhome/.forward"

      # Step-30 offender: /proc mounted WITHOUT hidepid (the stock state) and
      # ptrace_scope forced back to 0. The second half matters — the runner
      # kernel already ships ptrace_scope=1, so without planting the 0 the
      # check would pass with the role doing nothing (tautological).
      - name: Plant open process visibility for process_isolation to close
        run: |
          docker exec dh-test-node bash -c "
            mount -o remount,hidepid=0 /proc &&
            sysctl -qw kernel.yama.ptrace_scope=0 &&
            findmnt -no OPTIONS /proc &&
            sysctl -n kernel.yama.ptrace_scope"

      # Guess-cost offenders: the two knobs pinned to their WEAK values — an
      # explicit cost factor 5 (what stock yescrypt uses implicitly) and
      # FAIL_DELAY 0. The stock file carries NEITHER key, so planting them
      # forces the role through its reconcile path (lineinfile replaces, not
      # appends) and the checks flip red→green over real drift.
      - name: Plant weak guess-cost values for guess_cost to reconcile
        run: |
          docker exec dh-test-node bash -c "
            printf 'YESCRYPT_COST_FACTOR\t5\nFAIL_DELAY\t0\n' >> /etc/login.defs &&
            grep -E '^(YESCRYPT_COST_FACTOR|FAIL_DELAY)' /etc/login.defs"

      # Root-PATH offenders in ALL THREE sources that set root's PATH on
      # Debian (login.defs, /etc/profile — which OVERWRITES login.defs for
      # login shells — and /etc/crontab). Two kinds on purpose, because the
      # role treats them differently and that distinction IS the promise:
      #   - fixable: /opt/dh-path-loose (exists, world-writable) and a
      #     loosened /usr/local/bin must come back TIGHTENED and still in the
      #     PATH (deleting them would break locally installed binaries);
      #   - unfixable: an empty entry (= the current directory), a bare '.',
      #     and /opt/dh-path-gone which does not exist — these must vanish.
      - name: Plant PATH traps for root_path to sanitize
        run: |
          docker exec -i dh-test-node bash -s <<'SH'
          install -d -m 777 /opt/dh-path-loose
          chmod 777 /usr/local/bin
          dirty='/opt/dh-path-loose:/opt/dh-path-gone:/usr/local/sbin::/usr/local/bin:.:/usr/sbin:/usr/bin'
          sed -i "s|^ENV_SUPATH.*|ENV_SUPATH\tPATH=$dirty|" /etc/login.defs
          sed -i "5s|PATH=\"[^\"]*\"|PATH=\"$dirty:\"|" /etc/profile
          sed -i "s|^PATH=.*|PATH=$dirty|" /etc/crontab
          grep -E '^ENV_SUPATH' /etc/login.defs
          sed -n 5p /etc/profile
          SH

      # pw_history offenders: a LAX profile (remember=3, and no
      # enforce_for_root — measured: without it a reuse performed by root
      # prints the warning and goes through anyway) plus a loosened opasswd.
      # The stock system carries no profile at all, so planting one forces
      # the role through its overwrite path, and 0644 on a file of password
      # hashes is exactly the drift the mode pin must undo.
      - name: Plant a lax password-history profile for pw_history to overwrite
        run: |
          docker exec -i dh-test-node bash -s <<'SH'
          {
            printf 'Name: Password history (lax)\nDefault: yes\nPriority: 512\n'
            printf 'Password-Type: Primary\nPassword:\n'
            printf '\trequisite\t\t\tpam_pwhistory.so remember=3 use_authtok\n'
          } > /usr/share/pam-configs/hardening-pwhistory
          chmod 644 /etc/security/opasswd
          stat -c '%a' /etc/security/opasswd
          cat /usr/share/pam-configs/hardening-pwhistory
          SH

      # ssh_crypto offender: an explicit weak-crypto line in the MAIN sshd
      # config — the "legacy client compat" line every fleet has somewhere.
      # Debian includes sshd_config.d at the TOP of sshd_config and sshd
      # honours the FIRST occurrence of a keyword, so the role's drop-in
      # must beat this line: planting it proves the PRECEDENCE, not just
      # the file contents (and stock offers hmac-sha1 anyway — this keeps
      # the check meaningful the day upstream retires it).
      - name: Plant a weak-crypto line for ssh_crypto to override
        run: |
          docker exec -i dh-test-node bash -s <<'SH'
          printf 'MACs hmac-sha2-256,hmac-sha1\nKexAlgorithms ecdh-sha2-nistp256,curve25519-sha256\n' >> /etc/ssh/sshd_config
          sshd -t && tail -2 /etc/ssh/sshd_config
          SH

      # legacy_protocols offenders: a legacy client and a legacy superserver
      # apt can still install on Debian 13 — and `telnet` is the transitional
      # trap (a dummy package whose payload is inetutils-telnet via
      # update-alternatives: removing the dummy alone leaves /usr/bin/telnet
      # working). The purge must take the whole pair AND xinetd away.
      - name: Plant legacy protocol packages for legacy_protocols to purge
        run: |
          docker exec -i dh-test-node bash -s <<'SH'
          apt-get install -y --no-install-recommends telnet xinetd >/dev/null
          command -v telnet && dpkg-query -W telnet inetutils-telnet xinetd
          SH

      # fs_protected offenders: modern kernels ship fs.protected_* already ON
      # (1/1/1/2), so without planting the role would confirm a default. Write
      # all four to 0 via /proc (the privileged container's write takes) — the
      # role must tighten them back.
      - name: Plant weak fs.protected_* values for fs_protected to tighten
        run: |
          docker exec -i dh-test-node bash -s <<'SH'
          for f in symlinks hardlinks fifos regular; do echo 0 > /proc/sys/fs/protected_$f; done
          grep -H . /proc/sys/fs/protected_symlinks /proc/sys/fs/protected_regular
          SH

      # exploit_mitigations offenders: the runner ships full ASLR and a
      # soft-disabled unprivileged BPF, so plant the classic weak values (a
      # debugging session's randomize_va_space=0, BPF fully open, perf at
      # everything-goes -1) via /proc. kexec_load_disabled is the natural
      # offender (ships 0, one-way — nothing to plant), and the BPF plant
      # tolerates an already-latched kernel (writing 0 past the latch is
      # EPERM by design, measured). The two greps log the smoking gun: with
      # ASLR off, two fresh processes print the SAME stack base.
      - name: Plant exploit-mitigation offenders for the role to fix
        run: |
          docker exec -i dh-test-node bash -s <<'SH'
          echo 0 > /proc/sys/kernel/randomize_va_space
          echo 0 > /proc/sys/kernel/unprivileged_bpf_disabled 2>/dev/null \
            || echo "unprivileged_bpf_disabled already latched at 1 (one-way) - nothing to plant"
          echo -1 > /proc/sys/kernel/perf_event_paranoid
          if [ -e /proc/sys/net/core/bpf_jit_harden ]; then echo 0 > /proc/sys/net/core/bpf_jit_harden; fi
          echo "ASLR planted off - two fresh processes, same stack base:"
          grep -m1 "\[stack\]" /proc/self/maps | cut -d- -f1
          grep -m1 "\[stack\]" /proc/self/maps | cut -d- -f1
          grep -H . /proc/sys/kernel/randomize_va_space /proc/sys/kernel/perf_event_paranoid
          SH

      # account_hygiene offenders — the logins that hide in the account DATA,
      # all three measured to work on a stock node before the role was
      # written: an EMPTY password authenticates with a bare Enter (pam_unix
      # ships nullok), a hash sitting in world-readable /etc/passwd
      # authenticates from there too, and legacy NIS '+' entries are the
      # splice-the-map-in trigger the moment nsswitch ever flips to compat.
      - name: Plant account-database offenders for account_hygiene to clean
        run: |
          docker exec -i dh-test-node bash -s <<'SH'
          useradd --create-home --shell /bin/bash dhnopw && passwd -d dhnopw
          useradd --create-home --shell /bin/bash dhlegacy
          echo "dhlegacy:Sh4dow-Migr8-OK!9" | chpasswd
          h=$(grep "^dhlegacy:" /etc/shadow | cut -d: -f2)
          sed -i "s|^dhlegacy:x:|dhlegacy:$h:|" /etc/passwd
          sed -i "s|^dhlegacy:[^:]*:|dhlegacy:*:|" /etc/shadow
          printf "+::0:0:::\n" >> /etc/passwd
          printf "+::::::::\n" >> /etc/shadow
          printf "+:::\n" >> /etc/group
          grep -c "^+" /etc/passwd /etc/shadow /etc/group
          grep "^dhlegacy:" /etc/passwd | cut -c1-24
          SH

      # service_purge offenders - the network daemons a server runs because a
      # package pulled them in. The node image ships none, so install the three
      # (cups brings cups-daemon, the actual cupsd - the measured trap: purging
      # `cups` alone leaves it behind) before any pass, --check included.
      - name: Plant attack-surface services for service_purge to remove
        run: |
          docker exec -i dh-test-node bash -s <<'SH'
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y -qq --no-install-recommends avahi-daemon cups rpcbind >/dev/null 2>&1
          systemctl start avahi-daemon rpcbind cups 2>/dev/null || true
          dpkg -l avahi-daemon cups cups-daemon rpcbind | awk '/^ii/{print $2}' | tr '\n' ' '; echo
          ss -lntu | grep -E ':(5353|631|111)[[:space:]]' || echo "(no listener yet - units may need a moment)"
          SH

      # kernel_surface offenders: a stock kernel ships every one of these
      # interfaces open - plant the open values via /proc (io_uring allowed,
      # SysRq at Debian's 438, tty line disciplines autoloading, unprivileged
      # user namespaces on where the kernel carries the knob). The perl line
      # logs the smoking gun: io_uring_setup(2) hands anyone a ring fd.
      - name: Plant open kernel interfaces for kernel_surface to close
        run: |
          docker exec -i dh-test-node bash -s <<'SH'
          if [ -e /proc/sys/kernel/io_uring_disabled ]; then
            echo 0 > /proc/sys/kernel/io_uring_disabled
          else
            echo "no io_uring_disabled knob on this kernel (< 6.6)"
          fi
          echo 438 > /proc/sys/kernel/sysrq
          echo 1 > /proc/sys/dev/tty/ldisc_autoload
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            echo 1 > /proc/sys/kernel/unprivileged_userns_clone
          else
            echo "no unprivileged_userns_clone knob on this kernel (upstream build)"
          fi
          echo "io_uring open - io_uring_setup(2) hands anyone a ring:"
          perl -e '$p = "\0" x 120; $r = syscall(425, 8, $p); print "io_uring_setup -> $r", ($r < 0 ? " ($!)" : " (a ring fd)"), "\n"'
          grep -H . /proc/sys/kernel/io_uring_disabled /proc/sys/kernel/sysrq /proc/sys/dev/tty/ldisc_autoload \
            /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || true
          SH

      # suid_diet has natural offenders: passwd and login ship chfn/chsh/gpasswd/
      # newgrp setuid root and expiry setgid shadow. Nothing to plant - log the
      # shipped modes so the flip is visible.
      - name: Log the shipped setuid/setgid modes suid_diet will strip
        run: docker exec dh-test-node stat -c "%a %U:%G %n" /usr/bin/chfn /usr/bin/chsh /usr/bin/gpasswd /usr/bin/newgrp /usr/bin/expiry

      # apt_trust offender — the broken-mirror workaround that outlives the
      # mirror: both apt trust gates loosened in an apt.conf.d file. Measured
      # on a stock node: with these two lines a repository with no Release
      # file is fetched behind a one-line warning and its packages install
      # with "Authentication warning overridden". The role's 99- pin must beat
      # it (apt.conf.d is read in order, last setting wins) and verify reads
      # the EFFECTIVE config — this plant is what makes that check a proof
      # instead of a restatement of the defaults.
      - name: Plant loosened apt trust gates for apt_trust to override
        run: |
          docker exec -i dh-test-node bash -s <<'SH'
          printf 'Acquire::AllowInsecureRepositories "true";\nAPT::Get::AllowUnauthenticated "true";\n' > /etc/apt/apt.conf.d/90-weak-mirror-workaround
          apt-config dump | grep -E "AllowInsecureRepositories|AllowUnauthenticated"
          SH

      # The CI key doubles as the admin user's key. Written as a vars file
      # because -e key=value can't carry the spaces of an OpenSSH public key.
      - name: Prepare the admin user's public key as a vars file
        run: |
          echo "admin_user_pubkey: '$(cat tests/.ssh_ci/id_ci.pub)'" > tests/.ssh_ci/pubkey.yml

      - name: Dry-run on the fresh node (--check changes nothing)
        run: >
          ansible-playbook -i tests/inventory_first_run.ini site.yml --check
          -e @tests/vars_ci.yml -e @tests/.ssh_ci/pubkey.yml

      - name: "First pass: harden the node (connecting as root)"
        run: >
          ansible-playbook -i tests/inventory_first_run.ini site.yml
          -e @tests/vars_ci.yml -e @tests/.ssh_ci/pubkey.yml

      # Root is locked out now, so this pass connects as the admin user the
      # playbook just created — and must change nothing (idempotence).
      - name: "Second pass: as the admin user, changed=0"
        run: |
          output=$(ansible-playbook -i tests/inventory_hardened.ini site.yml \
            -e @tests/vars_ci.yml -e @tests/.ssh_ci/pubkey.yml)
          echo "$output" | tail -3
          echo "$output" | grep -q "changed=0" \
            || { echo "::error::The playbook is not idempotent"; exit 1; }

      - name: Verify the hardening from the outside
        run: ./tests/verify.sh

      - name: Tear the node down
        if: always()
        run: ./tests/node.sh down
