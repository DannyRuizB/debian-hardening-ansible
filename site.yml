---
# Baseline hardening for a fresh Debian 12/13 server.
# Mirrors the steps of the harden.sh script, but declarative and idempotent.
- name: Harden Debian baseline
  hosts: debian_servers
  become: true

  roles:
    # Order matters: create the admin user + key BEFORE locking down SSH,
    # so the ssh_hardening lockout guard can find a usable key.
    - admin_user
    - ssh_hardening
    - ufw
    - fail2ban
    - unattended_upgrades
    - sysctl_hardening
    # Account hygiene BEFORE account_policies on purpose: pwconv moves a
    # passwd-file hash into /etc/shadow, and the aging role only applies its
    # policy to accounts whose shadow entry holds a real hash — hygiene later
    # would leave that account unaged until the NEXT pass (the idempotence
    # gate catches /etc/shadow changing on the second run). Mirrors step 38
    # in the Bash twin, which runs before its aging step for the same reason.
    - account_hygiene
    - account_policies
    - mount_options
    - banners
    - sudo_hardening
    - ssh_policies
    - coredump_limits
    - umask_tmout
    - cron_restrictions
    - password_policy
    - aide
    - rkhunter
    - module_blacklist
    - faillock
    - file_permissions
    - ssh_access
    - service_sandboxing
    - journald
    - su_restriction
    - system_accounts
    # auditd (step 28 in the Bash twin) runs BEFORE the log sweep on
    # purpose: installing the package makes apt write its own /var/log/apt
    # files with loose modes, and the sweep must be the last thing that
    # touches /var/log — or the second pass re-tightens what apt just
    # wrote and the idempotence gate breaks.
    - auditd
    # Legacy protocol purge BEFORE the log sweep, same reason as auditd:
    # apt writes its /var/log/apt files with loose modes on every purge, and
    # the sweep must be the last thing that touches /var/log. The CI's
    # idempotence gate caught exactly this — with the purge last, pass 2's
    # sweep re-tightened what pass 1's purge made apt write. Mirrors step 36
    # in the Bash twin.
    - legacy_protocols
    # Time synchronization installs a package, and apt writes /var/log/apt
    # with loose modes on every install - so it must run BEFORE the log
    # sweep, the same ordering rule auditd and legacy_protocols follow (the
    # changed=0 gate caught them; this role learns from their scar).
    # Mirrors step 41 in the Bash twin.
    - time_sync
    # Attack-surface services: an apt purge — and apt rewrites
    # /var/log/apt/history.log and eipp.log.xz with loose modes on EVERY
    # run, whether or not it purged anything. Reproduced on a local node
    # before the CI gate got a second chance: with this role last, pass 2's
    # log sweep re-tightened those two files (changed=1). Same rule as
    # legacy_protocols and time_sync: every role that calls apt goes BEFORE
    # log_permissions. Mirrors step 44 in the Bash twin.
    - service_purge
    - log_permissions
    - logrotate_perms
    # Homes touch /home, not /var/log, so running after the log sweep is
    # safe — and it mirrors the Bash twin, where step 29 runs last.
    - home_permissions
    # Process isolation last: it touches /proc and a sysctl of its own, so it
    # is out of the way of the /var/log sweep ordering rule above.
    - process_isolation
    # Guess cost touches login.defs and PAM only — nothing under /var/log,
    # so running after the sweep is safe. Mirrors step 31 in the Bash twin.
    - guess_cost
    # Root PATH last: it tightens directory modes, and it must run AFTER
    # file_permissions — that role sets the sticky bit on world-writable
    # directories, and this one then removes their write bits. Mirrors step 32.
    - root_path
    # Apt updater sandboxing: a systemd drop-in, touches neither /var/log nor
    # anything an earlier role owns, so its position is free. Mirrors step 33.
    - apt_sandboxing
    # Password history touches PAM and /etc/security only — nothing under
    # /var/log, safe after the sweep. Mirrors step 34 in the Bash twin.
    - pw_history
    # SSH crypto policy: one sshd drop-in, nothing under /var/log, position
    # free. Mirrors step 35 in the Bash twin.
    - ssh_crypto
    # Filesystem protections: one sysctl drop-in, touches nothing another
    # role owns, position free. Mirrors step 37 in the Bash twin (36 is
    # legacy_protocols, run earlier for the /var/log ordering rule).
    - fs_protected
    # Exploit mitigations: its own sysctl drop-in (ASLR, kexec, unprivileged
    # BPF, JIT hardening, perf) — position free. Mirrors step 39.
    - exploit_mitigations
    # Kernel attack surface: its own sysctl drop-in (io_uring, SysRq, tty
    # ldisc autoload, unprivileged userns) — no apt, no /var/log, position
    # free. Mirrors step 45 in the Bash twin.
    - kernel_surface
    # SUID diet: dpkg-statoverride pins, no apt, no /var/log — position free.
    # Mirrors step 46 in the Bash twin.
    - suid_diet
    # Per-session process limits: one limits.d drop-in, no apt, no /var/log —
    # position free. Mirrors step 47 in the Bash twin.
    - process_limits
    # /tmp confinement: fstab + a mount of its own, touches nothing another
    # role owns (mount_options only handles /dev/shm), position free.
    # Mirrors step 40 in the Bash twin.
    - tmp_confinement
    # Apt source trust: one apt.conf.d drop-in and two read-only greps — it
    # runs no apt of its own (the gates apply to whoever calls apt next) and
    # touches nothing another role owns, position free. Mirrors step 42.
    - apt_trust
    # /var/tmp confinement: a bind mount of its own plus an fstab line,
    # touches nothing another role owns (tmp_confinement handles /tmp,
    # mount_options /dev/shm), position free. Mirrors step 43.
    - var_tmp_confinement
